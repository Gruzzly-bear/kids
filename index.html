<script>
const LABELS={ela:'Language Arts',math:'Math',science:'Science',social:'Social Studies',stem:'STEM',tech:'Technology'};
const state={view:null,assignments:null,schedules:{leon:[],logan:[]},scheduleTemplates:{leon:[],logan:[]},scheduledDays:{leon:{},logan:{}},scheduleDates:{leon:'',logan:''},displayCards:{leon:[],logan:[],monitor:[]},scheduleMessage:'',showEditor:false,auth:null};
const key='family-assignment-board-v1',pinKey='family-assignment-parent-pin',sessionKey='family-assignment-session-v1';
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function normalize(raw){const out={};for(const [student,subjects] of Object.entries(raw)){out[student]={};for(const [subject,rows] of Object.entries(subjects)){out[student][subject]=rows.map((r,i)=>({id:crypto.randomUUID?.()||student+subject+i,title:r[0].replace(/\[cite: 3\]/g,''),due:r[1]==='N/A'?'':toISO(r[1]),done:!!r[2]}));}}return out}
function toISO(value){const d=new Date(value);return isNaN(d)?'':d.toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function save(){localStorage.setItem(key,JSON.stringify(state.assignments))}
function bootstrap(){restoreSession()}
function studentName(){return state.view==='leon'?'Leon':'Logan'}
function mast(){return `<header class="mast"><div class="brand"><span class="brand-mark">F</span><span class="brand-copy"><b>Family</b><small>Learning dashboard</small></span></div>${state.view&&state.view!=='monitor'?`<button class="button light" onclick="goHome()">Switch student</button>`:''}</header>`}
function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d}function urgent(items){const today=dayStart();return items.filter(x=>{if(x.done||!x.due)return false;const due=new Date(x.due+'T00:00:00');return due<=today}).sort((a,b)=>a.due.localeCompare(b.due))}function focusItems(items){const urgentItems=urgent(items);return urgentItems.length?urgentItems.map(x=>{const due=new Date(x.due+'T00:00:00'),overdue=due<dayStart();return `<div class="focus-item ${overdue?'':'today'}"><strong>${esc(x.title)}</strong><span>${overdue?'Overdue':'Due today'} · ${due.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>`}).join(''):'<p class="small">Nothing overdue or due today.</p>'}function focus(items){const content=focusItems(items);return `<section class="focus"><h2>${urgent(items).length?'Due now & overdue':'You’re all caught up for today!'}</h2><div class="focus-list">${content}</div></section>`}function parentFocus(){const leon=Object.values(state.assignments.leon).flat(),logan=Object.values(state.assignments.logan).flat();return `<section class="focus"><h2>Due now & overdue</h2><div class="kid-columns"><div class="kid-column"><h3>🚀 Leon</h3>${focusItems(leon)}</div><div class="kid-column"><h3>⚡ Logan</h3>${focusItems(logan)}</div></div></section>`}
function render(){if(!state.view){app.innerHTML=mast()+`<section class="login"><span class="eyebrow">Your day, organized</span><h1>Ready to make<br>today count?</h1><p>Choose your profile to open a focused view of classes and assignments.</p><div class="people"><button class="person" onclick="enter('leon')"><span class="emoji">🚀</span><span><b>Leon</b><small>Open dashboard</small></span></button><button class="person" onclick="enter('logan')"><span class="emoji">⚡</span><span><b>Logan</b><small>Open dashboard</small></span></button></div><div class="home-actions"><button class="button" onclick="monitorLogin()">Open family monitor</button><button class="parent-link" onclick="parentLogin()">Parent / caregiver sign in</button></div></section>`;return}const subjects=state.assignments[state.view];const tasks=Object.values(subjects).flat();if(!state.subjectView){const dueBySubject=Object.entries(subjects).map(([subject,items])=>[subject,items.filter(x=>urgent(tasks).some(due=>due.id===x.id))]).filter(([,items])=>items.length);app.innerHTML=mast()+`<section class="hero"><div class="hero-row"><div><p class="small" style="color:#cfe1f4;margin:0 0 6px">${studentName()}'s assignment board</p><h1>What’s due today?</h1></div><button class="button light" onclick="goHome()">Sign out</button></div></section><section class="focus"><h2>${dueBySubject.length?'Due today & overdue':'You’re all caught up for today!'}</h2>${dueBySubject.length?`<div class="due-list">${dueBySubject.map(([subject,items])=>`<section class="due-class"><h3>${LABELS[subject]||subject}</h3><div class="due-class-tasks">${items.map(x=>`<div class="due-task">${task(x)}</div>`).join('')}</div></section>`).join('')}</div>`:'<p class="small">Nothing is due today.</p>'}</section><section><h2>Choose a class</h2><div class="class-picker">${Object.entries(subjects).map(([subject,items])=>`<button class="button light" onclick="openSubject('${subject}')">${LABELS[subject]||subject}<small>${items.filter(x=>!x.done).length} to do</small></button>`).join('')}</div></section>`;return}const complete=tasks.filter(x=>x.done).length;const selected=state.subjectView;const hideCompleted=localStorage.getItem('hide-completed')==='true';const cards=Object.entries(subjects).filter(([s])=>s===selected).map(([subject,items])=>{const shown=hideCompleted?items.filter(x=>!x.done):items;return `<section class="card"><h2>${LABELS[subject]||subject}</h2>${shown.length?shown.map(task).join(''):'<div class="empty">No assignments to show.</div>'}</section>`}).join('');app.innerHTML=mast()+`<section class="hero"><div class="hero-row"><div><p class="small" style="color:#cfe1f4;margin:0 0 6px">${studentName()}'s assignment board</p><h1>${LABELS[selected]||selected}</h1></div><button class="button light" onclick="showHub()">Back to hub</button></div><div class="progress-wrap"><div class="progress-label"><span>Completed</span><span>${complete} of ${tasks.length}</span></div><div class="bar"><i style="width:${tasks.length?complete/tasks.length*100:0}%"></i></div></div></section><div class="filters"><span class="small">Check off work when it’s finished.</span><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleCompleted()">Hide completed</label></div><div class="grid">${cards}</div>`}
function task(x){const due=x.due?new Date(x.due+'T00:00:00'):null;const today=new Date();today.setHours(0,0,0,0);const days=due?Math.round((due-today)/86400000):null;const cls=days!==null&&days<0&&!x.done?'late':days!==null&&days<=3&&!x.done?'soon':'';const label=due?`Due ${due.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`:'No due date';return `<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked disabled':''} onchange="toggle('${x.id}',this)" aria-label="Mark ${esc(x.title)} complete"><span><span class="task-name">${esc(x.title)}</span><span class="due ${cls}">${label}${cls==='soon'?' · due soon':cls==='late'?' · overdue':''}</span></span></div>`}
function enter(who){state.view=who;state.subjectView=null;render()}function goHome(){app.classList.remove('parent-shell','monitor-shell');clearInterval(state.monitorTimer);state.monitorTimer=null;localStorage.removeItem(sessionKey);state.view=null;state.subjectView=null;state.auth=null;state.parentPassword=null;render()}function openSubject(subject){state.subjectView=null;app.classList.remove('parent-shell');state.subjectView=subject;render()}function showHub(){state.subjectView=null;app.classList.remove('parent-shell');render()}function toggle(id,checkbox){if(checkbox.checked&&!confirm('Have you thoroughly completed your work?')){checkbox.checked=false;return}const found=findTask(id);if(!found)return;found.x.done=checkbox.checked;if(checkbox.checked)showSaveStatus('Great work — marked complete');saveAssignmentChange('update',found);render()}function setTaskDone(id,done){const found=findTask(id);if(!found)return;found.x.done=done;saveAssignmentChange('update',found);editor()}function toggleCompleted(){localStorage.setItem('hide-completed',String(event.target.checked));render()}
function parentLogin(){signIn('parent')}
function editor(){const student=state.editorStudent||'leon',data=state.assignments[student];const subjects=Object.keys(data);const hideCompleted=localStorage.getItem('hide-completed')==='true';app.innerHTML=mast()+`<section class="parent-page"><div class="hero-row"><div><p class="small" style="margin:0 0 6px">Family assignment board</p><h1>Parent editor</h1></div><button class="button light" onclick="goHome()">Sign out</button></div><p class="small">Updates save automatically on this device and browser.</p>${parentFocus()}<div class="notice">Choose a child, then add, revise, remove, or mark assignments complete.</div><div class="actions"><select id="editor-student" onchange="state.editorStudent=this.value;editor()">${Object.keys(state.assignments).map(s=>`<option value="${s}" ${s===student?'selected':''}>${s==='leon'?'Leon':'Logan'}</option>`).join('')}</select><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleEditorCompleted()">Hide completed</label><button class="button light" onclick="downloadBackup()">Download backup</button></div><form onsubmit="addAssignment(event)"><input name="title" required placeholder="New assignment"><input name="due" type="date"><select name="subject">${subjects.map(s=>`<option value="${s}">${LABELS[s]||s}</option>`).join('')}</select><button class="button">Add</button></form><h2>Change parent password</h2><form class="password-form" onsubmit="changePinForm(event)"><input name="current" type="password" required placeholder="Current password"><input name="next" type="password" required minlength="4" placeholder="New password"><input name="confirm" type="password" required placeholder="Confirm new password"><button class="button">Save password</button></form><div class="editor-list">${Object.entries(data).map(([subject,items])=>{const shown=hideCompleted?items.filter(x=>!x.done):items;return shown.length?`<section class="editor-subject"><h3>${LABELS[subject]||subject}</h3>${shown.map(x=>`<div class="edit-row"><input type="checkbox" ${x.done?'checked':''} onchange="setTaskDone('${x.id}',this.checked)" aria-label="Mark ${esc(x.title)} complete"><input value="${esc(x.title)}" onchange="editTask('${x.id}','title',this.value)"><input type="date" value="${x.due}" onchange="editTask('${x.id}','due',this.value)"><select onchange="moveTask('${x.id}',this.value)">${subjects.map(s=>`<option value="${s}" ${s===subject?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button onclick="removeTask('${x.id}')">Remove</button></div>`).join('')}</section>`:''}).join('')}</div></section>`}
function parentFocus(){const leon=Object.values(state.assignments.leon).flat(),logan=Object.values(state.assignments.logan).flat();return `<section class="focus"><h2>Due now & overdue</h2><div class="kid-columns"><div class="kid-column"><h3>🚀 Leon</h3><div class="kid-focus-list">${focusItems(leon)}</div></div><div class="kid-column"><h3>⚡ Logan</h3><div class="kid-focus-list">${focusItems(logan)}</div></div></div></section>`}
function editor(){const student=state.editorStudent||'leon',data=state.assignments[student],subjects=Object.keys(data),selected=data[state.editorSubject]?state.editorSubject:subjects[0],hideCompleted=localStorage.getItem('hide-completed')==='true';state.editorSubject=selected;const shown=hideCompleted?data[selected].filter(x=>!x.done):data[selected];const rows=shown.length?shown.map(x=>`<div class="edit-row"><input type="checkbox" ${x.done?'checked':''} onchange="setTaskDone('${x.id}',this.checked)" aria-label="Mark ${esc(x.title)} complete"><input value="${esc(x.title)}" onchange="editTask('${x.id}','title',this.value)"><input type="date" value="${x.due}" onchange="editTask('${x.id}','due',this.value)"><select onchange="moveTask('${x.id}',this.value)">${subjects.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button onclick="removeTask('${x.id}')">Remove</button></div>`).join(''):'<div class="empty">No assignments to show in this subject.</div>';app.innerHTML=mast()+`<section class="parent-page"><div class="hero-row"><div><p class="small" style="margin:0 0 6px">Family assignment board</p><h1>Parent editor</h1></div><button class="button light" onclick="goHome()">Sign out</button></div><p class="small">Updates save automatically on this device and browser.</p>${parentFocus()}<div class="notice">Choose a child and subject, then add, revise, remove, or mark assignments complete.</div><div class="actions"><select onchange="state.editorStudent=this.value;state.editorSubject=null;editor()">${Object.keys(state.assignments).map(s=>`<option value="${s}" ${s===student?'selected':''}>${s==='leon'?'Leon':'Logan'}</option>`).join('')}</select><select onchange="state.editorSubject=this.value;editor()">${subjects.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleEditorCompleted()">Hide completed</label><button class="button light" onclick="downloadBackup()">Download backup</button></div><form onsubmit="addAssignment(event)"><input name="title" required placeholder="New assignment"><input name="due" type="date"><select name="subject">${subjects.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button class="button">Add</button></form><div class="editor-list"><section class="editor-subject"><h3>${LABELS[selected]||selected}</h3>${rows}</section></div></section>`}
function findTask(id){for(const [student,subjects] of Object.entries(state.assignments))for(const [subject,rows] of Object.entries(subjects)){const index=rows.findIndex(x=>x.id===id);if(index>-1)return{student,subject,index,x:rows[index]}}}
function editTask(id,field,value){const found=findTask(id);found.x[field]=value;saveAssignmentChange('update',found)}function addAssignment(e){e.preventDefault();const f=new FormData(e.target),student=state.editorStudent||'leon',subject=f.get('subject'),x={id:crypto.randomUUID?.()||Date.now().toString(),title:f.get('title'),due:f.get('due'),done:false};state.assignments[student][subject].push(x);saveAssignmentChange('add',{student,subject,x});editor()}function moveTask(id,to){const found=findTask(id);if(found.subject===to)return;state.assignments[found.student][found.subject].splice(found.index,1);state.assignments[found.student][to].push(found.x);found.subject=to;saveAssignmentChange('update',found);editor()}function removeTask(id){if(!confirm('Remove this assignment?'))return;const found=findTask(id);state.lastRemoved={student:found.student,subject:found.subject,x:{...found.x}};state.assignments[found.student][found.subject].splice(found.index,1);saveAssignmentChange('remove',found);editor();showUndo()}function toggleEditorCompleted(){localStorage.setItem('hide-completed',String(event.target.checked));editor()}function changePinForm(e){e.preventDefault();alert('Saving password…')}function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.assignments,null,2)],{type:'application/json'}));a.download='family-assignment-backup.json';a.click();URL.revokeObjectURL(a.href)}
</script><script>
function dbData(rows){const out={leon:{},logan:{}};for(const r of rows){(out[r.student][r.subject]??=[]).push({id:r.id,title:r.title,due:r.due||'',done:!!r.done})}return out}
function scheduleDay(){return new Date().toLocaleDateString('en-CA')}
function copySchedule(items){return JSON.parse(JSON.stringify(items||[]))}
function scheduleExpiry(date){const d=new Date(date+'T13:00:00');d.setDate(d.getDate()+1);return d}
function cleanScheduledDays(days){return Object.fromEntries(Object.entries(days||{}).filter(([date])=>scheduleExpiry(date)>new Date()).map(([date,items])=>[date,copySchedule(items)]))}
function scheduleFor(student,date=scheduleDay()){return copySchedule(state.scheduledDays[student]?.[date]||state.scheduleTemplates[student]||[])}
function loadSchedules(raw){for(const student of ['leon','logan']){const stored=raw?.[student],legacy=Array.isArray(stored),template=legacy?stored:stored?.template||[],days={...(stored?.days||{})};if(!legacy&&stored?.date&&Array.isArray(stored.today))days[stored.date]=stored.today;state.scheduleTemplates[student]=copySchedule(template);state.scheduledDays[student]=cleanScheduledDays(days);state.scheduleDates[student]=scheduleDay();state.schedules[student]=scheduleFor(student)}}
function schedulePayload(){return Object.fromEntries(['leon','logan'].map(student=>[student,{template:state.scheduleTemplates[student],days:cleanScheduledDays(state.scheduledDays[student])}]))}
function loadCards(raw){const defaults={leon:['🎯 Focus on today','📚 One class at a time','💧 Take a water break','⭐ You’ve got this'],logan:['🎯 Focus on today','📚 One class at a time','💧 Take a water break','⭐ You’ve got this'],monitor:['🌅 Start strong','🍎 Lunch at noon','📚 Check due work','✅ Celebrate progress']};for(const scope of ['leon','logan','monitor'])state.displayCards[scope]=Array.from({length:4},(_,i)=>String(raw?.[scope]?.[i]??defaults[scope][i]))}
function selectScheduleDate(date){const student=state.editorStudent||'leon';state.scheduleDates[student]=date||scheduleDay();state.schedules[student]=scheduleFor(student,state.scheduleDates[student]);state.scheduleMessage=state.scheduledDays[student]?.[state.scheduleDates[student]]?'Loaded saved day':'Started from the default schedule';refreshScheduleEditor()}
function commitOpenSchedule(){const student=state.editorStudent||'leon',date=state.scheduleDates[student]||scheduleDay();state.scheduledDays[student][date]=copySchedule(state.schedules[student])}
function savedSession(){try{const session=JSON.parse(localStorage.getItem(sessionKey));return session?.role==='monitor'||['parent','leon','logan'].includes(session?.role)&&typeof session.password==='string'?session:null}catch{return null}}
async function restoreSession(){const session=savedSession();if(!session){render();return}const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(session)});const data=await r.json();if(!r.ok){localStorage.removeItem(sessionKey);render();return}state.assignments=dbData(data.assignments);loadSchedules(data.schedules);loadCards(data.cards);state.auth=session;state.parentPassword=session.role==='parent'?session.password:null;state.view=session.role==='monitor'||session.view==='monitor'?'monitor':session.role==='parent'?'parent':session.role;state.subjectView=null;state.view==='monitor'?monitorPage():session.role==='parent'?editor():render()}
async function signIn(role,destination){const password=prompt('Password:');if(password===null)return;const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,password})});const data=await r.json();if(!r.ok){alert(data.error||'Sign-in failed.');return}state.assignments=dbData(data.assignments);loadSchedules(data.schedules);loadCards(data.cards);state.auth={role,password,...(destination?{view:destination}:{})};localStorage.setItem(sessionKey,JSON.stringify(state.auth));state.parentPassword=role==='parent'?password:null;state.view=destination|| (role==='parent'?'parent':role);state.subjectView=null;destination==='monitor'?monitorPage():role==='parent'?editor():render()}
async function openMonitor(){const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role:'monitor'})}),data=await r.json();if(!r.ok){alert(data.error||'The family monitor could not be opened.');return}state.assignments=dbData(data.assignments);loadSchedules(data.schedules);loadCards(data.cards);state.auth={role:'monitor'};localStorage.setItem(sessionKey,JSON.stringify(state.auth));state.parentPassword=null;monitorPage()}

function monitorSchedule(student){const items=[...(state.schedules[student]||[])].sort((a,b)=>scheduleMinutes(a.time)-scheduleMinutes(b.time)),now=new Date(),minutes=now.getHours()*60+now.getMinutes(),current=items.reduce((active,x,i)=>scheduleMinutes(x.time)<=minutes?i:active,-1),next=items.findIndex(x=>scheduleMinutes(x.time)>minutes);return items.length?items.map((x,i)=>`<div class="schedule-item ${x.type==='break'?'break':''} ${i===current?'current':''} ${i===next?'next':''}" style="${scheduleItemStyle(x)}"><span>${esc(scheduleLabel(x))}${i===current?' · now':i===next?' · next':''}</span><time>${formatScheduleTime(x.time)}</time></div>`).join(''):'<p class="empty">No schedule set for today.</p>'}
function monitorDue(student){const rows=Object.entries(state.assignments[student]).flatMap(([subject,items])=>items.map(x=>({...x,subject}))),items=urgent(rows);return items.length?items.map(x=>`<div class="monitor-assignment"><strong>${esc(x.title)}</strong><span>${LABELS[x.subject]||x.subject} · ${x.due<scheduleDay()?'Overdue':'Due today'}</span></div>`).join(''):'<p class="empty">Nothing due today.</p>'}
function monitorPage(){state.view='monitor';for(const student of ['leon','logan'])state.schedules[student]=scheduleFor(student);app.classList.remove('parent-shell');app.classList.add('monitor-shell');const today=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});app.innerHTML=mast()+`<section class="monitor-heading"><div><p>${today}</p><h1>Today’s family plan</h1></div><button class="button light" onclick="goHome()">Close monitor</button></section><div class="monitor-grid">${['leon','logan'].map(student=>`<section class="monitor-child"><h2>${student==='leon'?'🚀 Leon':'⚡ Logan'}</h2><div class="monitor-sections"><section><h3>Schedule</h3><div class="monitor-list">${monitorSchedule(student)}</div></section><section><h3>Due today & overdue</h3><div class="monitor-list">${monitorDue(student)}</div></section></div></section>`).join('')}</div>${displayCards('monitor','monitor-cards')}`;clearInterval(state.monitorTimer);state.monitorTimer=setInterval(()=>{if(state.view==='monitor')monitorPage()},60000)}
function sideDue(student){const items=urgent(Object.values(state.assignments[student]).flat()),name=student==='leon'?'Leon':'Logan';return `<aside class="parent-side ${student==='leon'?'left':'right'}"><h2>${name}’s due work</h2><div class="parent-side-list">${items.length?items.map(x=>`<div class="focus-item ${x.due<scheduleDay()?'':'today'}"><strong>${esc(x.title)}</strong><span>${x.due||'No due date'}</span></div>`).join(''):'<p class="small">Nothing due today.</p>'}</div>${sideSchedule(student)}</aside>`}
function openScheduleFor(student){state.editorStudent=student;state.editorSubject=null;state.parentMode='schedule';state.scheduleDates[student]=scheduleDay();state.schedules[student]=scheduleFor(student);editor();openScheduleEditor()}
const scheduleSideEditor=editor;editor=()=>{scheduleSideEditor();const page=document.querySelector('.parent-page'),picker=page?.querySelector(':scope > .actions > select:first-child'),title=page?.querySelector(':scope > .hero-row > div');if(picker&&title){const holder=document.createElement('label');holder.className='student-picker';holder.innerHTML='<span>Editing assignments for</span>';picker.classList.add('child-picker');holder.append(picker);title.append(holder)}page?.querySelector('.editor-subject h3')?.insertAdjacentHTML('afterend','<div class="assignment-column-guide" aria-hidden="true"><span>Done</span><span>Assignment</span><span>Due date</span><span>Subject</span><span></span></div>')}

function displayCards(scope,className='dashboard-cards'){return `<section class="${className}">${(state.displayCards[scope]||[]).map((text,i)=>`<article class="dashboard-note"><span>${esc(text)||`Block ${i+1}`}</span></article>`).join('')}</section>`}
async function editDisplayCard(scope,index,value){state.displayCards[scope][index]=value;await queuedWrite({...state.auth,cards:state.displayCards,cardsOnly:true},'Dashboard card')}
function cardEditorPanel(student){const fields=scope=>`<div class="card-edit-grid">${state.displayCards[scope].map((value,i)=>`<label><span>Block ${i+1}</span><input maxlength="120" value="${esc(value)}" onchange="editDisplayCard('${scope}',${i},this.value)" placeholder="Text, emoji, reminder…"></label>`).join('')}</div>`;return `<section class="card-editor-panel"><div><span class="section-kicker">Dashboard cards</span><h2>${student==='leon'?'Leon':'Logan'}’s four cards</h2><p class="small">Short text and emoji shown beneath this child’s header.</p>${fields(student)}</div><div><span class="section-kicker">Family monitor</span><h2>Shared four cards</h2><p class="small">Shown across the bottom of the family monitor.</p>${fields('monitor')}</div></section>`}
function closeCardEditor(){document.getElementById('card-editor-modal')?.remove()}
function openCardEditor(student){closeCardEditor();const name=student==='leon'?'Leon':'Logan';document.body.insertAdjacentHTML('beforeend',`<section id="card-editor-modal" class="import-modal card-editor-modal" onclick="if(event.target===this)closeCardEditor()"><div class="import-box card-editor-window"><div class="modal-heading"><div><span class="section-kicker">Dashboard content</span><h2>Edit ${name}’s cards</h2></div><button class="button light" onclick="closeCardEditor()">Close</button></div>${cardEditorPanel(student)}<p class="small modal-save-note">Changes save automatically when you leave a field.</p></div></section>`)}
function classBrowserEnabled(){return localStorage.getItem('show-class-browser')==='true'}
function setClassBrowser(enabled){localStorage.setItem('show-class-browser',String(enabled));render()}
const dashboardCardRender=render;render=()=>{dashboardCardRender();if(!['leon','logan'].includes(state.view)||state.subjectView)return;const top=document.querySelector('.student-top');if(top)top.insertAdjacentHTML('beforeend',displayCards(state.view));if(!classBrowserEnabled())for(const heading of document.querySelectorAll('section>h2'))if(heading.textContent.trim()==='Choose a class')heading.parentElement.remove()}

const themeKey='family-assignment-theme',THEMES=['material','facebook','forest','sand','dark'];
function savedTheme(){const saved=localStorage.getItem(themeKey);return saved==='indigo'?'facebook':THEMES.includes(saved)?saved:'material'}
function applyTheme(theme){document.documentElement.dataset.theme=theme}
function setTheme(theme){localStorage.setItem(themeKey,theme);applyTheme(theme);state.view==='monitor'?monitorPage():state.view==='parent'?editor():render()}
const boardMast=mast;mast=()=>boardMast().replace('</header>',`${['leon','logan'].includes(state.view)?`<label class="top-toggle"><input type="checkbox" ${classBrowserEnabled()?'checked':''} onchange="setClassBrowser(this.checked)"><span>Class browser</span></label>`:''}<label class="theme-picker"><span>Theme</span><select onchange="setTheme(this.value)" aria-label="Choose appearance theme"><option value="material" ${savedTheme()==='material'?'selected':''}>Material</option><option value="facebook" ${savedTheme()==='facebook'?'selected':''}>Blue</option><option value="forest" ${savedTheme()==='forest'?'selected':''}>Forest</option><option value="sand" ${savedTheme()==='sand'?'selected':''}>Coffee</option><option value="dark" ${savedTheme()==='dark'?'selected':''}>Dark</option></select></label></header>`);
applyTheme(savedTheme());
bootstrap();
</script></body></html>
