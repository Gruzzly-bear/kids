<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b66">
  <title>Family Assignment Board</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23123b66'/%3E%3Cpath d='M17 17h30v32H17z' fill='%23fff'/%3E%3Cpath d='M23 27h18M23 35h18M23 43h11' stroke='%234cc9a7' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#123b66;--ink:#19324a;--muted:#66788b;--paper:#fffdf8;--line:#dbe5ee;--mint:#4cc9a7;--sun:#ffca55;--coral:#f17d71;--sky:#e7f4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef8ff 0%,#fffdf8 55%,#effbf6 100%);color:var(--ink);font-family:ui-rounded,"Nunito",system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:28px 20px 48px}.mast{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{font-size:1.25rem;font-weight:900;letter-spacing:-.03em}.brand span{color:var(--navy)}.small{color:var(--muted);font-size:.9rem}.button{border:0;border-radius:12px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:800;box-shadow:0 3px 0 #082845}.button.light{color:var(--navy);background:#fff;border:1px solid var(--line);box-shadow:none}.button.danger{background:#b52e3e;box-shadow:0 3px 0 #7e1521}.login{max-width:720px;margin:10vh auto 0;text-align:center}.login h1{font-size:clamp(2.1rem,7vw,4rem);line-height:1;margin:0 0 14px;letter-spacing:-.06em;color:var(--navy)}.login p{font-size:1.1rem;color:var(--muted);margin:0 0 30px}.people{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.person{border:1px solid var(--line);border-radius:24px;padding:30px 16px;background:rgba(255,255,255,.88);box-shadow:0 12px 32px rgba(34,76,111,.1);font-weight:900;font-size:1.4rem;color:var(--ink)}.person:hover{transform:translateY(-3px);border-color:var(--mint)}.person .emoji{display:block;font-size:3.3rem;margin-bottom:10px}.parent-link{margin-top:28px;background:none;border:0;text-decoration:underline;color:var(--muted)}.hero{background:var(--navy);color:white;border-radius:24px;padding:24px 28px;margin-bottom:24px;box-shadow:0 12px 30px rgba(18,59,102,.18)}.hero h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.05em}.hero-row{display:flex;align-items:end;justify-content:space-between;gap:20px}.progress-wrap{margin-top:18px;max-width:480px}.progress-label{display:flex;justify-content:space-between;font-size:.9rem;font-weight:800;margin-bottom:7px}.bar{height:11px;border-radius:20px;background:#ffffff42;overflow:hidden}.bar i{height:100%;display:block;background:var(--mint);border-radius:20px}.filters{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0}.filters select{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 12px;color:var(--ink)}.switch{display:flex;align-items:center;gap:8px;font-weight:750;color:var(--ink);white-space:nowrap}.switch input{width:18px;height:18px;accent-color:#159e7b}.focus{background:#fff6e4;border:1px solid #f3d17c;border-radius:18px;padding:17px;margin:0 0 20px}.focus h2{margin:0 0 10px;color:#8a5700;font-size:1.1rem}.focus-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.focus-item{background:#fff;border-radius:10px;padding:10px 12px;border-left:4px solid var(--coral)}.focus-item.today{border-left-color:#db9a19}.focus-item strong,.focus-item span{display:block}.focus-item span{font-size:.84rem;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:19px;overflow:hidden;box-shadow:0 8px 18px rgba(37,72,101,.07)}.card h2{margin:0;padding:14px 17px;background:var(--sky);font-size:1.1rem}.task{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;border-top:1px solid #eef3f6}.task input{width:21px;height:21px;accent-color:#159e7b;margin-top:2px;flex:0 0 auto}.task-name{display:block;font-weight:750;line-height:1.3}.task.done .task-name{text-decoration:line-through;color:#8090a0}.due{display:block;margin-top:5px;color:var(--muted);font-size:.83rem;font-weight:650}.due.soon{color:#b16a00}.due.late{color:#bd3d42}.empty{padding:22px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;background:#0e294e99;display:grid;place-items:center;padding:16px;z-index:5}.modal-box{background:var(--paper);width:min(710px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:24px;box-shadow:0 20px 70px #071a32aa}.modal h2{margin:0 0 6px}.modal form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;margin:18px 0}.modal input,.modal select{min-width:0;border:1px solid #bfccd7;border-radius:10px;padding:10px;background:white}.editor-list{border-top:1px solid var(--line)}.edit-row{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.edit-row input,.edit-row select{min-width:0}.edit-row button{padding:8px 10px;border:0;border-radius:8px;background:#fff0f0;color:#a32839;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:11px 13px;border-radius:10px;background:#eef9f5;color:#176e5b;font-size:.9rem;font-weight:650}.hidden{display:none!important}@media(max-width:650px){.shell{padding:20px 14px}.mast{margin-bottom:18px}.people{grid-template-columns:1fr}.hero{padding:20px}.hero-row,.filters{align-items:flex-start;flex-direction:column}.modal form,.edit-row{grid-template-columns:1fr 1fr}.modal form button{grid-column:span 2}.edit-row button{grid-column:2}.edit-row input:first-child{grid-column:span 2}}
  </style>
</head>
<body><main class="shell" id="app" aria-live="polite"></main>
<script src="assignments-data.js"></script>
<script>
const LABELS={ela:'Language Arts',math:'Math',science:'Science',social:'Social Studies',stem:'STEM',tech:'Technology'};
const state={view:null,assignments:null,showEditor:false};
const key='family-assignment-board-v1',pinKey='family-assignment-parent-pin';
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function normalize(raw){const out={};for(const [student,subjects] of Object.entries(raw)){out[student]={};for(const [subject,rows] of Object.entries(subjects)){out[student][subject]=rows.map((r,i)=>({id:crypto.randomUUID?.()||student+subject+i,title:r[0].replace(/\[cite: 3\]/g,''),due:r[1]==='N/A'?'':toISO(r[1]),done:!!r[2]}));}}return out}
function toISO(value){const d=new Date(value);return isNaN(d)?'':d.toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function save(){localStorage.setItem(key,JSON.stringify(state.assignments))}
function bootstrap(){let saved=load();if(saved){state.assignments=saved;render();return}try{if(!window.seedAssignments)throw Error('list not found');state.assignments=normalize(window.seedAssignments);save();render()}catch(e){document.querySelector('#app').innerHTML='<p>We could not open the assignment lists. Please refresh.</p>'}}
function studentName(){return state.view==='leon'?'Leon':'Logan'}
function mast(){return `<header class="mast"><div class="brand">✦ <span>Family</span> Assignment Board</div>${state.view?`<button class="button light" onclick="goHome()">Switch student</button>`:''}</header>`}
function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d}function urgent(items){const today=dayStart();return items.filter(x=>{if(x.done||!x.due)return false;const due=new Date(x.due+'T00:00:00');return due<=today}).sort((a,b)=>a.due.localeCompare(b.due))}function focus(items,parent=false){const urgentItems=urgent(items);if(!urgentItems.length)return `<section class="focus"><h2>${parent?'Nothing overdue or due today — nice work!':'You’re all caught up for today!'}</h2></section>`;return `<section class="focus"><h2>${parent?'Due now & overdue — both kids':'Due now & overdue'}</h2><div class="focus-list">${urgentItems.map(x=>{const due=new Date(x.due+'T00:00:00'),overdue=due<dayStart();return `<div class="focus-item ${overdue?'':'today'}"><strong>${parent?`${studentFor(x.id)} — `:''}${esc(x.title)}</strong><span>${overdue?'Overdue':'Due today'} · ${due.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>`}).join('')}</div></section>`}function studentFor(id){for(const [student,subjects] of Object.entries(state.assignments))for(const rows of Object.values(subjects))if(rows.some(x=>x.id===id))return student==='leon'?'Leon':'Logan';return ''}
function render(){if(!state.view){app.innerHTML=mast()+`<section class="login"><h1>Who is ready to learn?</h1><p>Choose your name to see your own assignment board.</p><div class="people"><button class="person" onclick="enter('leon')"><span class="emoji">🚀</span>Leon</button><button class="person" onclick="enter('logan')"><span class="emoji">⚡</span>Logan</button></div><button class="parent-link" onclick="parentLogin()">Parent / caregiver sign in</button></section>`;return}const subjects=state.assignments[state.view];const tasks=Object.values(subjects).flat();const complete=tasks.filter(x=>x.done).length;const selected=document.getElementById('subject-filter')?.value||'all';const hideCompleted=localStorage.getItem('hide-completed')==='true';const cards=Object.entries(subjects).filter(([s])=>selected==='all'||s===selected).map(([subject,items])=>{const shown=hideCompleted?items.filter(x=>!x.done):items;return `<section class="card"><h2>${LABELS[subject]||subject}</h2>${shown.length?shown.map(task).join(''):'<div class="empty">No assignments to show.</div>'}</section>`}).join('');app.innerHTML=mast()+`<section class="hero"><div class="hero-row"><div><p class="small" style="color:#cfe1f4;margin:0 0 6px">${studentName()}'s assignment board</p><h1>Let’s make today count.</h1></div><button class="button light" onclick="goHome()">Sign out</button></div><div class="progress-wrap"><div class="progress-label"><span>Completed</span><span>${complete} of ${tasks.length}</span></div><div class="bar"><i style="width:${tasks.length?complete/tasks.length*100:0}%"></i></div></div></section>${focus(tasks)}<div class="filters"><span class="small">Check off work when it’s finished.</span><div class="actions"><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleCompleted()">Hide completed</label><select id="subject-filter" aria-label="Filter by subject" onchange="render()"><option value="all">All subjects</option>${Object.keys(subjects).map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select></div></div><div class="grid">${cards}</div>`}
function task(x){const due=x.due?new Date(x.due+'T00:00:00'):null;const today=new Date();today.setHours(0,0,0,0);const days=due?Math.round((due-today)/86400000):null;const cls=days!==null&&days<0&&!x.done?'late':days!==null&&days<=3&&!x.done?'soon':'';const label=due?`Due ${due.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`:'No due date';return `<label class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}')" aria-label="Mark ${esc(x.title)} complete"><span><span class="task-name">${esc(x.title)}</span><span class="due ${cls}">${label}${cls==='soon'?' · due soon':cls==='late'?' · overdue':''}</span></span></label>`}
function enter(who){state.view=who;render()}function goHome(){state.view=null;render()}function toggle(id){for(const subjects of Object.values(state.assignments))for(const rows of Object.values(subjects)){const x=rows.find(a=>a.id===id);if(x)x.done=!x.done}save();render()}function toggleCompleted(){localStorage.setItem('hide-completed',String(event.target.checked));render()}
function parentLogin(){const pin=prompt('Enter the parent passcode.');if(pin===null)return;const existing=localStorage.getItem(pinKey)||'family';if(pin!==existing){alert('That passcode did not match.');return}state.showEditor=true;editor()}
function editor(){const student=state.editorStudent||'leon',data=state.assignments[student];const subjects=Object.keys(data),allTasks=Object.values(state.assignments).flatMap(subjects=>Object.values(subjects).flat());const hideCompleted=localStorage.getItem('hide-completed')==='true';app.innerHTML=mast()+`<div class="modal"><section class="modal-box"><button class="button light" style="float:right" onclick="goHome()">Close</button><h2>Parent editor</h2><p class="small">Updates save automatically on this device and browser.</p>${focus(allTasks,true)}<div class="notice">Choose a child, then add, revise, or remove assignments.</div><div class="actions"><select id="editor-student" onchange="state.editorStudent=this.value;editor()">${Object.keys(state.assignments).map(s=>`<option value="${s}" ${s===student?'selected':''}>${s==='leon'?'Leon':'Logan'}</option>`).join('')}</select><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleEditorCompleted()">Hide completed</label><button class="button light" onclick="changePin()">Change passcode</button><button class="button light" onclick="downloadBackup()">Download backup</button></div><form onsubmit="addAssignment(event)"><input name="title" required placeholder="New assignment"><input name="due" type="date"><select name="subject">${subjects.map(s=>`<option value="${s}">${LABELS[s]||s}</option>`).join('')}</select><button class="button">Add</button></form><div class="editor-list">${Object.entries(data).map(([subject,items])=>(hideCompleted?items.filter(x=>!x.done):items).map(x=>`<div class="edit-row"><input value="${esc(x.title)}" onchange="editTask('${x.id}','title',this.value)"><input type="date" value="${x.due}" onchange="editTask('${x.id}','due',this.value)"><select onchange="moveTask('${x.id}',this.value)">${subjects.map(s=>`<option value="${s}" ${s===subject?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button onclick="removeTask('${x.id}')">Remove</button></div>`).join('')).join('')}</div></section></div>`}
function findTask(id){for(const [student,subjects] of Object.entries(state.assignments))for(const [subject,rows] of Object.entries(subjects)){const index=rows.findIndex(x=>x.id===id);if(index>-1)return{student,subject,index,x:rows[index]}}}
function editTask(id,field,value){const found=findTask(id);found.x[field]=value;save()}function addAssignment(e){e.preventDefault();const f=new FormData(e.target),student=state.editorStudent||'leon';state.assignments[student][f.get('subject')].push({id:crypto.randomUUID?.()||Date.now().toString(),title:f.get('title'),due:f.get('due'),done:false});save();editor()}function moveTask(id,to){const found=findTask(id);if(found.subject===to)return;state.assignments[found.student][found.subject].splice(found.index,1);state.assignments[found.student][to].push(found.x);save();editor()}function removeTask(id){if(!confirm('Remove this assignment?'))return;const found=findTask(id);state.assignments[found.student][found.subject].splice(found.index,1);save();editor()}function toggleEditorCompleted(){localStorage.setItem('hide-completed',String(event.target.checked));editor()}function changePin(){const next=prompt('New parent passcode (at least 4 characters):');if(next&&next.length>=4){localStorage.setItem(pinKey,next);alert('Passcode changed.')}}function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.assignments,null,2)],{type:'application/json'}));a.download='family-assignment-backup.json';a.click();URL.revokeObjectURL(a.href)}
bootstrap();
</script></body></html>
