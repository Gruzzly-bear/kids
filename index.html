<html lang="en">
<head>

  <title>Family Assignment Board</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23123b66'/%3E%3Cpath d='M17 17h30v32H17z' fill='%23fff'/%3E%3Cpath d='M23 27h18M23 35h18M23 43h11' stroke='%234cc9a7' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#123b66;--ink:#19324a;--muted:#66788b;--paper:#fffdf8;--line:#dbe5ee;--mint:#4cc9a7;--sun:#ffca55;--coral:#f17d71;--sky:#e7f4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef8ff 0%,#fffdf8 55%,#effbf6 100%);color:var(--ink);font-family:ui-rounded,"Nunito",system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:28px 20px 48px}.mast{display:flex;justify-content:flex-start;align-items:center;gap:20px;margin-bottom:28px}.brand{font-size:1.25rem;font-weight:900;letter-spacing:-.03em}.brand span{color:var(--navy)}.small{color:var(--muted);font-size:.9rem}.button{border:0;border-radius:12px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:800;box-shadow:0 3px 0 #082845}.button.light{color:var(--navy);background:#fff;border:1px solid var(--line);box-shadow:none}.login{max-width:720px;margin:10vh auto 0;text-align:center}.login h1{font-size:clamp(2.1rem,7vw,4rem);line-height:1;margin:0 0 14px;letter-spacing:-.06em;color:var(--navy)}.login p{font-size:1.1rem;color:var(--muted);margin:0 0 30px}.people{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.person{border:1px solid var(--line);border-radius:24px;padding:30px 16px;background:rgba(255,255,255,.88);box-shadow:0 12px 32px rgba(34,76,111,.1);font-weight:900;font-size:1.4rem;color:var(--ink)}.person:hover{transform:translateY(-3px);border-color:var(--mint)}.person .emoji{display:block;font-size:3.3rem;margin-bottom:10px}.parent-link{margin-top:28px;background:none;border:0;text-decoration:underline;color:var(--muted)}.hero{background:var(--navy);color:white;border-radius:24px;padding:24px 28px;margin-bottom:24px;box-shadow:0 12px 30px rgba(18,59,102,.18)}.hero h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.05em}.hero-row{display:flex;align-items:end;justify-content:space-between;gap:20px}.progress-wrap{margin-top:18px;max-width:480px}.progress-label{display:flex;justify-content:space-between;font-size:.9rem;font-weight:800;margin-bottom:7px}.bar{height:11px;border-radius:20px;background:#ffffff42;overflow:hidden}.bar i{height:100%;display:block;background:var(--mint);border-radius:20px}.filters{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0}.filters select,.parent-page input,.parent-page select{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 12px}.switch{display:flex;align-items:center;gap:8px;font-weight:750;color:var(--ink);white-space:nowrap}.switch input{width:18px;height:18px;accent-color:#159e7b}.focus{background:#fff6e4;border:1px solid #f3d17c;border-radius:18px;padding:17px;margin:0 0 20px}.focus h2{margin:0 0 10px;color:#8a5700;font-size:1.1rem}.focus-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.focus-item{background:#fff;border-radius:10px;padding:10px 12px;border-left:4px solid var(--coral)}.focus-item.today{border-left-color:#db9a19}.focus-item strong,.focus-item span{display:block}.focus-item span{font-size:.84rem;color:var(--muted);margin-top:3px}.kid-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.kid-column{background:#fff;border-radius:12px;padding:12px}.kid-column h3{margin:0 0 10px;color:var(--navy)}.kid-column .focus-item+.focus-item{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:19px;overflow:hidden;box-shadow:0 8px 18px rgba(37,72,101,.07)}.card h2{margin:0;padding:14px 17px;background:var(--sky);font-size:1.1rem}.task{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;border-top:1px solid #eef3f6}.task input{width:21px;height:21px;accent-color:#159e7b;margin-top:2px;flex:0 0 auto}.task-name{display:block;font-weight:750;line-height:1.3}.task.done .task-name{text-decoration:line-through;color:#8090a0}.due{display:block;margin-top:5px;color:var(--muted);font-size:.83rem;font-weight:650}.due.soon{color:#b16a00}.due.late{color:#bd3d42}.empty{padding:22px;color:var(--muted);text-align:center}.parent-page{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(34,76,111,.08)}.parent-page h1{margin:0}.parent-page form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;margin:18px 0}.password-form{grid-template-columns:1fr 1fr 1fr auto!important;background:#eff8ff;padding:14px;border-radius:14px;margin-bottom:22px!important}.editor-list{border-top:1px solid var(--line)}.edit-row{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.edit-row input,.edit-row select{min-width:0}.edit-row button{padding:8px 10px;border:0;border-radius:8px;background:#fff0f0;color:#a32839;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:11px 13px;border-radius:10px;background:#eef9f5;color:#176e5b;font-size:.9rem;font-weight:650}.hidden{display:none!important}@media(max-width:650px){.shell{padding:20px 14px}.mast{margin-bottom:18px}.people,.kid-columns{grid-template-columns:1fr}.hero{padding:20px}.hero-row,.filters{align-items:flex-start;flex-direction:column}.parent-page form,.edit-row{grid-template-columns:1fr 1fr}.parent-page form button{grid-column:span 2}.edit-row button{grid-column:2}.edit-row input:first-child{grid-column:span 2}}
  </style>
</head>
<body><main class="shell" id="app" aria-live="polite"></main>
<style>
  .class-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.class-picker button{min-height:72px;text-align:left}.class-picker small{display:block;margin-top:4px;color:var(--muted)}.due-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}.due-class{background:#fff9ed;border:1px solid #f3d17c;border-radius:12px;overflow:hidden}.due-class h3{margin:0;padding:9px 12px;background:#fff1d7;color:#8a5700;font-size:.9rem}.due-class-tasks{display:grid;grid-auto-rows:104px;gap:8px;max-height:346px;overflow-y:auto;padding:8px}.due-task .task{height:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px}.due-task .task-name{font-size:.94rem}.kid-focus-list{display:grid;gap:8px;max-height:220px;overflow-y:auto}.edit-row{grid-template-columns:28px minmax(180px,1.6fr) minmax(150px,1fr) minmax(150px,1fr) auto!important}.editor-subject{margin:20px 0}.editor-subject h3{margin:0;padding:10px 12px;background:var(--sky);border-radius:10px 10px 0 0;color:var(--navy);font-size:1rem}.editor-subject .edit-row{padding:10px 12px;background:#fff;border:1px solid var(--line);border-top:0}.editor-subject .edit-row:last-child{border-radius:0 0 10px 10px}.edit-row input[type="checkbox"]{width:21px;height:21px;accent-color:#159e7b}
</style>
<style>.button{transition:transform .15s ease,box-shadow .15s ease,background .15s ease}.button:hover{transform:translateY(-2px);box-shadow:0 5px 10px rgba(18,59,102,.2)}.button:active{transform:translateY(0);box-shadow:none}.button:focus-visible{outline:3px solid #ffca55;outline-offset:3px}.schedule{background:#e6f7f1;border:1px solid #b6e1d5;border-left:0;border-radius:14px;color:#174b47;padding:14px 16px;min-width:280px;box-shadow:0 8px 18px rgba(13,91,80,.12)}.schedule h2{font-size:1rem;margin:0 0 8px;padding-bottom:8px;color:#174b47;border-bottom:1px solid #b6e1d5}.schedule-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 8px;margin-top:5px;background:#ffffff9c;border-left:3px solid #3aa993;border-radius:7px;font-weight:800}.schedule-item span{min-width:0;text-shadow:0 0 1px rgba(23,75,71,.8),0 1px 1px rgba(255,255,255,.9)}.schedule-item.break{color:#925e00;border-left-color:#d99a17}.schedule-item time{flex:0 0 auto;font-variant-numeric:tabular-nums;color:#174b47;background:#d1eee5;border-radius:6px;padding:3px 6px;text-shadow:none}.schedule-editor{display:none}.schedule-editor.open{display:block;position:fixed;z-index:10;inset:8vh max(20px,calc((100vw - 800px)/2));overflow:auto;margin:0;padding:24px;background:#eff8ff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(18,59,102,.3)}.schedule-editor h2{margin:0 0 10px}.schedule-row{display:grid;grid-template-columns:100px 1fr 120px auto;gap:8px;margin:8px 0}.schedule-status{margin-left:10px;color:#176e5b;font-weight:800}.parent-shell{max-width:1800px;display:grid;grid-template-columns:240px minmax(0,1160px) 240px;gap:22px}.parent-shell .mast{grid-column:1/-1}.parent-shell .parent-page{grid-column:2;grid-row:2}.parent-shell .parent-page>.focus{display:none}.parent-side{grid-row:2;align-self:start;position:sticky;top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 8px 18px rgba(37,72,101,.07)}.parent-side.left{grid-column:1}.parent-side.right{grid-column:3}.parent-side h2{font-size:1rem;margin:0 0 10px}.parent-side-list{display:grid;gap:8px;max-height:70vh;overflow-y:auto}.parent-side .focus-item{font-size:.88rem}@media(max-width:1450px){.parent-shell{max-width:1200px;display:block}.parent-shell .parent-side{display:none}}</style>
<style>#save-status{position:fixed;right:20px;bottom:20px;z-index:30;padding:11px 14px;border-radius:10px;background:#176e5b;color:#fff;font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.2)}#save-status.failed{background:#a32839}@media(max-width:650px){.schedule-editor.open{inset:12px;padding:16px}.schedule-row{grid-template-columns:1fr 1fr;gap:8px}.edit-row{grid-template-columns:28px 1fr!important}.edit-row select,.edit-row button{grid-column:2}.parent-page form{grid-template-columns:1fr!important}}</style>
<script>
const LABELS={ela:'Language Arts',math:'Math',science:'Science',social:'Social Studies',stem:'STEM',tech:'Technology'};
const state={view:null,assignments:null,schedules:{leon:[],logan:[]},scheduleTemplates:{leon:[],logan:[]},scheduleDates:{leon:'',logan:''},scheduleMessage:'',showEditor:false,auth:null};
const key='family-assignment-board-v1',pinKey='family-assignment-parent-pin',sessionKey='family-assignment-session-v1';
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function normalize(raw){const out={};for(const [student,subjects] of Object.entries(raw)){out[student]={};for(const [subject,rows] of Object.entries(subjects)){out[student][subject]=rows.map((r,i)=>({id:crypto.randomUUID?.()||student+subject+i,title:r[0].replace(/\[cite: 3\]/g,''),due:r[1]==='N/A'?'':toISO(r[1]),done:!!r[2]}));}}return out}
function toISO(value){const d=new Date(value);return isNaN(d)?'':d.toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function save(){localStorage.setItem(key,JSON.stringify(state.assignments))}
function bootstrap(){restoreSession()}
function studentName(){return state.view==='leon'?'Leon':'Logan'}
function mast(){return `<header class="mast"><div class="brand">✦ <span>Family</span> Assignment Board</div>${state.view?`<button class="button light" onclick="goHome()">Switch student</button>`:''}</header>`}
function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d}function urgent(items){const today=dayStart();return items.filter(x=>{if(x.done||!x.due)return false;const due=new Date(x.due+'T00:00:00');return due<=today}).sort((a,b)=>a.due.localeCompare(b.due))}function focusItems(items){const urgentItems=urgent(items);return urgentItems.length?urgentItems.map(x=>{const due=new Date(x.due+'T00:00:00'),overdue=due<dayStart();return `<div class="focus-item ${overdue?'':'today'}"><strong>${esc(x.title)}</strong><span>${overdue?'Overdue':'Due today'} · ${due.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>`}).join(''):'<p class="small">Nothing overdue or due today.</p>'}function focus(items){const content=focusItems(items);return `<section class="focus"><h2>${urgent(items).length?'Due now & overdue':'You’re all caught up for today!'}</h2><div class="focus-list">${content}</div></section>`}function parentFocus(){const leon=Object.values(state.assignments.leon).flat(),logan=Object.values(state.assignments.logan).flat();return `<section class="focus"><h2>Due now & overdue</h2><div class="kid-columns"><div class="kid-column"><h3>🚀 Leon</h3>${focusItems(leon)}</div><div class="kid-column"><h3>⚡ Logan</h3>${focusItems(logan)}</div></div></section>`}
function render(){if(!state.view){app.innerHTML=mast()+`<section class="login"><h1>Who is ready to learn?</h1><p>Choose your name to see your own assignment board.</p><div class="people"><button class="person" onclick="enter('leon')"><span class="emoji">🚀</span>Leon</button><button class="person" onclick="enter('logan')"><span class="emoji">⚡</span>Logan</button></div><button class="parent-link" onclick="parentLogin()">Parent / caregiver sign in</button></section>`;return}const subjects=state.assignments[state.view];const tasks=Object.values(subjects).flat();if(!state.subjectView){const dueBySubject=Object.entries(subjects).map(([subject,items])=>[subject,items.filter(x=>urgent(tasks).some(due=>due.id===x.id))]).filter(([,items])=>items.length);app.innerHTML=mast()+`<section class="hero"><div class="hero-row"><div><p class="small" style="color:#cfe1f4;margin:0 0 6px">${studentName()}'s assignment board</p><h1>What’s due today?</h1></div><button class="button light" onclick="goHome()">Sign out</button></div></section><section class="focus"><h2>${dueBySubject.length?'Due today & overdue':'You’re all caught up for today!'}</h2>${dueBySubject.length?`<div class="due-list">${dueBySubject.map(([subject,items])=>`<section class="due-class"><h3>${LABELS[subject]||subject}</h3><div class="due-class-tasks">${items.map(x=>`<div class="due-task">${task(x)}</div>`).join('')}</div></section>`).join('')}</div>`:'<p class="small">Nothing is due today.</p>'}</section><section><h2>Choose a class</h2><div class="class-picker">${Object.entries(subjects).map(([subject,items])=>`<button class="button light" onclick="openSubject('${subject}')">${LABELS[subject]||subject}<small>${items.filter(x=>!x.done).length} to do</small></button>`).join('')}</div></section>`;return}const complete=tasks.filter(x=>x.done).length;const selected=state.subjectView;const hideCompleted=localStorage.getItem('hide-completed')==='true';const cards=Object.entries(subjects).filter(([s])=>s===selected).map(([subject,items])=>{const shown=hideCompleted?items.filter(x=>!x.done):items;return `<section class="card"><h2>${LABELS[subject]||subject}</h2>${shown.length?shown.map(task).join(''):'<div class="empty">No assignments to show.</div>'}</section>`}).join('');app.innerHTML=mast()+`<section class="hero"><div class="hero-row"><div><p class="small" style="color:#cfe1f4;margin:0 0 6px">${studentName()}'s assignment board</p><h1>${LABELS[selected]||selected}</h1></div><button class="button light" onclick="showHub()">Back to hub</button></div><div class="progress-wrap"><div class="progress-label"><span>Completed</span><span>${complete} of ${tasks.length}</span></div><div class="bar"><i style="width:${tasks.length?complete/tasks.length*100:0}%"></i></div></div></section><div class="filters"><span class="small">Check off work when it’s finished.</span><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleCompleted()">Hide completed</label></div><div class="grid">${cards}</div>`}
function task(x){const due=x.due?new Date(x.due+'T00:00:00'):null;const today=new Date();today.setHours(0,0,0,0);const days=due?Math.round((due-today)/86400000):null;const cls=days!==null&&days<0&&!x.done?'late':days!==null&&days<=3&&!x.done?'soon':'';const label=due?`Due ${due.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`:'No due date';return `<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked disabled':''} onchange="toggle('${x.id}',this)" aria-label="Mark ${esc(x.title)} complete"><span><span class="task-name">${esc(x.title)}</span><span class="due ${cls}">${label}${cls==='soon'?' · due soon':cls==='late'?' · overdue':''}</span></span></div>`}
function enter(who){state.view=who;state.subjectView=null;render()}function goHome(){app.classList.remove('parent-shell');localStorage.removeItem(sessionKey);state.view=null;state.subjectView=null;state.auth=null;state.parentPassword=null;render()}function openSubject(subject){state.subjectView=null;app.classList.remove('parent-shell');state.subjectView=subject;render()}function showHub(){state.subjectView=null;app.classList.remove('parent-shell');render()}function toggle(id,checkbox){if(checkbox.checked&&!confirm('Have you thoroughly completed your work?')){checkbox.checked=false;return}const found=findTask(id);if(!found)return;found.x.done=checkbox.checked;saveAssignmentChange('update',found);render()}function setTaskDone(id,done){const found=findTask(id);if(!found)return;found.x.done=done;saveAssignmentChange('update',found);editor()}function toggleCompleted(){localStorage.setItem('hide-completed',String(event.target.checked));render()}
function parentLogin(){signIn('parent')}
function editor(){const student=state.editorStudent||'leon',data=state.assignments[student];const subjects=Object.keys(data);const hideCompleted=localStorage.getItem('hide-completed')==='true';app.innerHTML=mast()+`<section class="parent-page"><div class="hero-row"><div><p class="small" style="margin:0 0 6px">Family assignment board</p><h1>Parent editor</h1></div><button class="button light" onclick="goHome()">Sign out</button></div><p class="small">Updates save automatically on this device and browser.</p>${parentFocus()}<div class="notice">Choose a child, then add, revise, remove, or mark assignments complete.</div><div class="actions"><select id="editor-student" onchange="state.editorStudent=this.value;editor()">${Object.keys(state.assignments).map(s=>`<option value="${s}" ${s===student?'selected':''}>${s==='leon'?'Leon':'Logan'}</option>`).join('')}</select><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleEditorCompleted()">Hide completed</label><button class="button light" onclick="downloadBackup()">Download backup</button></div><form onsubmit="addAssignment(event)"><input name="title" required placeholder="New assignment"><input name="due" type="date"><select name="subject">${subjects.map(s=>`<option value="${s}">${LABELS[s]||s}</option>`).join('')}</select><button class="button">Add</button></form><h2>Change parent password</h2><form class="password-form" onsubmit="changePinForm(event)"><input name="current" type="password" required placeholder="Current password"><input name="next" type="password" required minlength="4" placeholder="New password"><input name="confirm" type="password" required placeholder="Confirm new password"><button class="button">Save password</button></form><div class="editor-list">${Object.entries(data).map(([subject,items])=>{const shown=hideCompleted?items.filter(x=>!x.done):items;return shown.length?`<section class="editor-subject"><h3>${LABELS[subject]||subject}</h3>${shown.map(x=>`<div class="edit-row"><input type="checkbox" ${x.done?'checked':''} onchange="setTaskDone('${x.id}',this.checked)" aria-label="Mark ${esc(x.title)} complete"><input value="${esc(x.title)}" onchange="editTask('${x.id}','title',this.value)"><input type="date" value="${x.due}" onchange="editTask('${x.id}','due',this.value)"><select onchange="moveTask('${x.id}',this.value)">${subjects.map(s=>`<option value="${s}" ${s===subject?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button onclick="removeTask('${x.id}')">Remove</button></div>`).join('')}</section>`:''}).join('')}</div></section>`}
function parentFocus(){const leon=Object.values(state.assignments.leon).flat(),logan=Object.values(state.assignments.logan).flat();return `<section class="focus"><h2>Due now & overdue</h2><div class="kid-columns"><div class="kid-column"><h3>🚀 Leon</h3><div class="kid-focus-list">${focusItems(leon)}</div></div><div class="kid-column"><h3>⚡ Logan</h3><div class="kid-focus-list">${focusItems(logan)}</div></div></div></section>`}
function editor(){const student=state.editorStudent||'leon',data=state.assignments[student],subjects=Object.keys(data),selected=data[state.editorSubject]?state.editorSubject:subjects[0],hideCompleted=localStorage.getItem('hide-completed')==='true';state.editorSubject=selected;const shown=hideCompleted?data[selected].filter(x=>!x.done):data[selected];const rows=shown.length?shown.map(x=>`<div class="edit-row"><input type="checkbox" ${x.done?'checked':''} onchange="setTaskDone('${x.id}',this.checked)" aria-label="Mark ${esc(x.title)} complete"><input value="${esc(x.title)}" onchange="editTask('${x.id}','title',this.value)"><input type="date" value="${x.due}" onchange="editTask('${x.id}','due',this.value)"><select onchange="moveTask('${x.id}',this.value)">${subjects.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button onclick="removeTask('${x.id}')">Remove</button></div>`).join(''):'<div class="empty">No assignments to show in this subject.</div>';app.innerHTML=mast()+`<section class="parent-page"><div class="hero-row"><div><p class="small" style="margin:0 0 6px">Family assignment board</p><h1>Parent editor</h1></div><button class="button light" onclick="goHome()">Sign out</button></div><p class="small">Updates save automatically on this device and browser.</p>${parentFocus()}<div class="notice">Choose a child and subject, then add, revise, remove, or mark assignments complete.</div><div class="actions"><select onchange="state.editorStudent=this.value;state.editorSubject=null;editor()">${Object.keys(state.assignments).map(s=>`<option value="${s}" ${s===student?'selected':''}>${s==='leon'?'Leon':'Logan'}</option>`).join('')}</select><select onchange="state.editorSubject=this.value;editor()">${subjects.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><label class="switch"><input type="checkbox" ${hideCompleted?'checked':''} onchange="toggleEditorCompleted()">Hide completed</label><button class="button light" onclick="downloadBackup()">Download backup</button></div><form onsubmit="addAssignment(event)"><input name="title" required placeholder="New assignment"><input name="due" type="date"><select name="subject">${subjects.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABELS[s]||s}</option>`).join('')}</select><button class="button">Add</button></form><div class="editor-list"><section class="editor-subject"><h3>${LABELS[selected]||selected}</h3>${rows}</section></div></section>`}
function findTask(id){for(const [student,subjects] of Object.entries(state.assignments))for(const [subject,rows] of Object.entries(subjects)){const index=rows.findIndex(x=>x.id===id);if(index>-1)return{student,subject,index,x:rows[index]}}}
function editTask(id,field,value){const found=findTask(id);found.x[field]=value;saveAssignmentChange('update',found)}function addAssignment(e){e.preventDefault();const f=new FormData(e.target),student=state.editorStudent||'leon',subject=f.get('subject'),x={id:crypto.randomUUID?.()||Date.now().toString(),title:f.get('title'),due:f.get('due'),done:false};state.assignments[student][subject].push(x);saveAssignmentChange('add',{student,subject,x});editor()}function moveTask(id,to){const found=findTask(id);if(found.subject===to)return;state.assignments[found.student][found.subject].splice(found.index,1);state.assignments[found.student][to].push(found.x);found.subject=to;saveAssignmentChange('update',found);editor()}function removeTask(id){if(!confirm('Remove this assignment?'))return;const found=findTask(id);state.assignments[found.student][found.subject].splice(found.index,1);saveAssignmentChange('remove',found);editor()}function toggleEditorCompleted(){localStorage.setItem('hide-completed',String(event.target.checked));editor()}function changePinForm(e){e.preventDefault();alert('Saving password…')}function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.assignments,null,2)],{type:'application/json'}));a.download='family-assignment-backup.json';a.click();URL.revokeObjectURL(a.href)}
</script><script>
function dbData(rows){const out={leon:{},logan:{}};for(const r of rows){(out[r.student][r.subject]??=[]).push({id:r.id,title:r.title,due:r.due||'',done:!!r.done})}return out}
function scheduleDay(){return new Date().toLocaleDateString('en-CA')}
function copySchedule(items){return JSON.parse(JSON.stringify(items||[]))}
function loadSchedules(raw){for(const student of ['leon','logan']){const stored=raw?.[student],legacy=Array.isArray(stored),template=legacy?stored:stored?.template||[],today=legacy?stored:stored?.today||[];state.scheduleTemplates[student]=copySchedule(template);state.schedules[student]=copySchedule(today.length?today:template);state.scheduleDates[student]=scheduleDay()}}
function schedulePayload(){return Object.fromEntries(['leon','logan'].map(student=>[student,{template:state.scheduleTemplates[student],date:state.scheduleDates[student],today:state.schedules[student]}]))}
function savedSession(){try{const session=JSON.parse(localStorage.getItem(sessionKey));return ['parent','leon','logan'].includes(session?.role)&&typeof session.password==='string'?session:null}catch{return null}}
async function restoreSession(){const session=savedSession();if(!session){render();return}const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(session)});const data=await r.json();if(!r.ok){localStorage.removeItem(sessionKey);render();return}state.assignments=dbData(data.assignments);loadSchedules(data.schedules);state.auth=session;state.parentPassword=session.role==='parent'?session.password:null;state.view=session.role==='parent'?'parent':session.role;state.subjectView=null;session.role==='parent'?editor():render()}
async function signIn(role){const password=prompt('Password:');if(password===null)return;const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role,password})});const data=await r.json();if(!r.ok){alert(data.error||'Sign-in failed.');return}state.assignments=dbData(data.assignments);loadSchedules(data.schedules);state.auth={role,password};localStorage.setItem(sessionKey,JSON.stringify(state.auth));state.parentPassword=role==='parent'?password:null;state.view=role==='parent'?'parent':role;state.subjectView=null;role==='parent'?editor():render()}
enter=who=>signIn(who);parentLogin=()=>signIn('parent');
async function saveAssignmentChange(type,found){if(!state.auth)return;const change={type,student:found.student,subject:found.subject,id:found.x.id,title:found.x.title,due:found.x.due,done:found.x.done};const r=await fetch('/api/assignments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...state.auth,change})});if(!r.ok)alert('Your assignment update could not be saved. Please try again.')}
const SCHEDULE_COLORS={ela:'#a8558d',math:'#2877b8',science:'#25866c',social:'#d28621',stem:'#7849b8',tech:'#168a9c'};function scheduleLabel(item){return item.subject&&item.subject!=='custom'?(LABELS[item.subject]||item.subject):item.label}function scheduleLineColor(item){return SCHEDULE_COLORS[item.subject]||(item.type==='break'?'#d99a17':'#3aa993')}function formatScheduleTime(value){const [hour,minute]=String(value||'').split(':').map(Number);if(!Number.isInteger(hour)||!Number.isInteger(minute))return value||'';return `${hour%12||12}:${String(minute).padStart(2,'0')} ${hour<12?'AM':'PM'}`}function schedulePanel(){const items=state.schedules[state.view]||[];return `<aside class="schedule"><h2>Today’s schedule</h2>${items.length?items.map(x=>`<div class="schedule-item ${x.type==='break'?'break':''}" style="border-left-color:${scheduleLineColor(x)}"><span style="color:#174b47">${esc(scheduleLabel(x))}</span><time>${formatScheduleTime(x.time)}</time></div>`).join(''):'<span class="small">No schedule set yet.</span>'}</aside>`}
async function saveScheduleChanges(){if(!state.auth)return;const r=await fetch('/api/assignments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...state.auth,schedules:schedulePayload(),scheduleOnly:true})});if(!r.ok)alert('Your schedule could not be saved. Please try again.')}
function refreshScheduleEditor(){editor();openScheduleEditor()}function addScheduleEntry(){const student=state.editorStudent||'leon';(state.schedules[student]??=[]).push({type:'class',subject:Object.keys(state.assignments[student])[0]||'custom',label:'Custom event',time:'09:00'});state.scheduleMessage='Added schedule item';saveScheduleChanges();refreshScheduleEditor()}function setScheduleSubject(index,subject){const student=state.editorStudent||'leon',item=state.schedules[student][index];item.subject=subject;item.type=subject==='break'?'break':'class';if(subject!=='custom'&&subject!=='break')item.label=LABELS[subject]||subject;saveScheduleChanges();refreshScheduleEditor()}
function editScheduleEntry(index,field,value){const student=state.editorStudent||'leon';state.schedules[student][index][field]=value;saveScheduleChanges()}
function removeScheduleEntry(index){const student=state.editorStudent||'leon';state.schedules[student].splice(index,1);state.scheduleMessage='Removed schedule item';saveScheduleChanges();refreshScheduleEditor()}
function saveScheduleAsDefault(){const student=state.editorStudent||'leon';state.scheduleTemplates[student]=copySchedule(state.schedules[student]);state.scheduleMessage='Saved as default';saveScheduleChanges();refreshScheduleEditor()}
function resetTodaySchedule(){const student=state.editorStudent||'leon';state.schedules[student]=copySchedule(state.scheduleTemplates[student]);state.scheduleDates[student]=scheduleDay();state.scheduleMessage='Reset to the default schedule';saveScheduleChanges();refreshScheduleEditor()}
const baseRender=render;render=()=>{baseRender();if(state.view&&state.view!=='parent'&&!state.subjectView){document.querySelector('.hero-row')?.insertAdjacentHTML('beforeend',schedulePanel())}}
function openScheduleEditor(){document.querySelector('.schedule-editor')?.classList.add('open')}function closeScheduleEditor(){document.querySelector('.schedule-editor')?.classList.remove('open')}function sideDue(student){const items=urgent(Object.values(state.assignments[student]).flat());return `<aside class="parent-side ${student==='leon'?'left':'right'}"><h2>${student==='leon'?'Leon':'Logan'}’s due work</h2><div class="parent-side-list">${items.length?items.map(x=>`<div class="focus-item ${x.due<scheduleDay()?'':'today'}"><strong>${esc(x.title)}</strong><span>${x.due||'No due date'}</span></div>`).join(''):'<p class="small">Nothing due today.</p>'}</div></aside>`}
const baseEditor=editor;editor=()=>{baseEditor();const student=state.editorStudent||'leon',items=state.schedules[student]||[],subjects=Object.keys(state.assignments[student]);document.querySelector('.parent-page .notice')?.insertAdjacentHTML('afterend',`<section class="schedule-editor"><button class="button light" onclick="closeScheduleEditor()">Close</button><h2>${student==='leon'?'Leon':'Logan'}’s schedule for today <span class="schedule-status">${esc(state.scheduleMessage)}</span></h2>${items.map((x,i)=>`<div class="schedule-row"><select onchange="setScheduleSubject(${i},this.value)">${subjects.map(s=>`<option value="${s}" ${x.subject===s?'selected':''}>${LABELS[s]||s}</option>`).join('')}<option value="custom" ${!x.subject||x.subject==='custom'?'selected':''}>Custom</option></select><input value="${esc(x.label)}" onchange="editScheduleEntry(${i},'label',this.value)" placeholder="Custom class or break label" ${x.subject&&x.subject!=='custom'?'disabled':''}><input type="time" value="${esc(x.time)}" onchange="editScheduleEntry(${i},'time',this.value)"><button onclick="removeScheduleEntry(${i})">Remove</button></div>`).join('')}<div class="actions"><button class="button light" onclick="addScheduleEntry()">Add schedule item</button><button class="button light" onclick="resetTodaySchedule()">Reset today</button><button class="button" onclick="saveScheduleAsDefault()">Save as default</button></div></section>`);document.querySelector('.parent-page .notice')?.insertAdjacentHTML('beforebegin','<button class="button light" onclick="openScheduleEditor()">Edit schedule</button>');app.classList.add('parent-shell');app.insertAdjacentHTML('beforeend',sideDue('leon')+sideDue('logan'))}
let writeQueue=Promise.resolve();
function showSaveStatus(message,failed=false){let toast=document.getElementById('save-status');if(!toast){toast=document.createElement('div');toast.id='save-status';document.body.append(toast)}toast.textContent=message;toast.className=failed?'failed':'saved';clearTimeout(showSaveStatus.timer);showSaveStatus.timer=setTimeout(()=>toast.remove(),2600)}
async function queuedWrite(body,label){writeQueue=writeQueue.then(async()=>{for(let attempt=0;attempt<3;attempt++){try{const r=await fetch('/api/assignments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(r.ok){showSaveStatus(`${label} saved`);return}if(attempt===2)throw Error()}catch{if(attempt===2){showSaveStatus(`${label} could not be saved`,true);return}await new Promise(resolve=>setTimeout(resolve,400*(attempt+1)))}}});return writeQueue}
async function saveAssignmentChange(type,found){if(!state.auth)return;const change={type,student:found.student,subject:found.subject,id:found.x.id,title:found.x.title,due:found.x.due,done:found.x.done};return queuedWrite({...state.auth,change},'Assignment')}
async function saveScheduleChanges(){if(!state.auth)return;return queuedWrite({...state.auth,schedules:schedulePayload(),scheduleOnly:true},'Schedule')}
const finalEditor=editor;editor=()=>{finalEditor();document.querySelectorAll('.schedule-editor .schedule-row select').forEach((select,index)=>{if(!select.querySelector('option[value="break"]'))select.insertAdjacentHTML('beforeend','<option value="break">Break</option>');const item=(state.schedules[state.editorStudent||'leon']||[])[index];if(item?.subject==='break'){select.value='break';select.parentElement.querySelector('input')?.removeAttribute('disabled')}})}
bootstrap();
</script></body></html>
