    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .checkbox-custom {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 3px solid #cbd5e1;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .checkbox-custom:checked {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }
        .task-row {
            transition: all 0.3s ease;
        }
        /* Mute out completed text and override the date color */
        .task-row.completed span.task-text, .task-row.completed span.due-text {
            text-decoration: line-through;
            color: #94a3b8 !important;
        }
        .task-row.completed {
            background-color: #f8fafc;
        }
        /* Hide priority tags if completed */
        .task-row.completed .date-tag {
            display: none !important;
        }
        
        /* Scrollbox styling */
        .task-list-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .task-list-container::-webkit-scrollbar {
            width: 8px;
        }
        .task-list-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .task-list-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .task-list-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Custom subject colors */
        .card-math { border-top: 6px solid #ef4444; }
        .text-math { color: #ef4444; }
        
        .card-ela { border-top: 6px solid #3b82f6; }
        .text-ela { color: #3b82f6; }
        
        .card-science { border-top: 6px solid #10b981; }

        .card-social { border-top: 6px solid #f59e0b; }
        .text-social { color: #f59e0b; }
        
        .card-tech { border-top: 6px solid #8b5cf6; }
        .text-tech { color: #8b5cf6; }

        document.addEventListener('DOMContentLoaded', () => {
            
            // To ensure color coding works predictably based on your prompt context, 
            // "today" is strictly set to Wednesday, Sept 23, 2026
            const currentDate = new Date('2026-09-23T00:00:00');
            currentDate.setHours(0,0,0,0);

            // Populate lists dynamically
            Object.keys(assignmentsData).forEach(subject => {
                const container = document.getElementById(`${subject}-list`);
                let html = '';
                assignmentsData[subject].forEach((item, index) => {
                    const id = `${subject}-${index}`;
                    const isHardCompleted = item[2]; // Pre-checked parameter
                    
                    // Allow localStorage to keep user checks, but default to the hardcoded completions
                    const savedState = localStorage.getItem(id);
                    const isCompleted = savedState !== null ? savedState === 'true' : isHardCompleted;

                    let dateColorClass = 'text-slate-500 font-bold';
                    let dateTag = '';
                    let dueText = item[1] === "N/A" ? "No Due Date" : `Due: ${item[1]}`;

                    // Evaluate tags and colors based on the current context date
                    if (item[1] === "N/A") {
                        dateColorClass = 'text-emerald-500 font-bold'; // Green for N/A
                    } else {
                        const dueDate = new Date(item[1]);
                        dueDate.setHours(0,0,0,0);
                        
                        const diffTime = dueDate.getTime() - currentDate.getTime();
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                        if (diffDays < 0) {
                            dateColorClass = 'text-red-500 font-bold'; // Red for past due
                            dateTag = '<span class="date-tag ml-2 bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold uppercase border border-red-200">Past Due</span>';
                        } else if (diffDays >= 0 && diffDays <= 3) {
                            dateColorClass = 'text-amber-500 font-bold'; // Yellow for approaching soon
                            dateTag = '<span class="date-tag ml-2 bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs font-bold uppercase border border-amber-200">Due Soon</span>';
                        }
                    }

                    const checkedAttr = isCompleted ? 'checked' : '';
                    const completedClass = isCompleted ? 'completed' : '';

                    html += `
                        <label class="task-row ${completedClass} flex items-start gap-3 p-3 rounded-lg hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0">
                            <input type="checkbox" id="${id}" class="checkbox-custom task-checkbox" ${checkedAttr}>
                            <div class="flex flex-col">
                                <span class="task-text text-slate-700 font-semibold text-sm sm:text-base">${item[0]}</span>
                                <div class="flex items-center mt-1">
                                    <span class="due-text text-xs ${dateColorClass}">${dueText}</span>
                                    ${dateTag}
                                </div>
                            </div>
                        </label>
                    `;
                });
                if(container) container.innerHTML = html;
            });

            // Tracking elements
            const checkboxes = document.querySelectorAll('.task-checkbox');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const cheerMessage = document.getElementById('cheer-message');
            const totalTasks = checkboxes.length;
            
            const cheers = [
                "10%", 
                "20%", 
                "30%", 
                "40%", 
                "50%",
                "60%",
                "70%",
                "80%",
                "90%",
                "99.9%",
                "100%"
            ];

            function updateProgress() {
                const completedTasks = document.querySelectorAll('.task-checkbox:checked').length;
                const percentage = (completedTasks / totalTasks) * 100;
                
                // Update bar and text
                progressBar.style.width = `${percentage}%`;
                progressText.textContent = `${completedTasks} / ${totalTasks} Completed`;
                
                // Show cheer message based on progress
                if (completedTasks > 0) {
                    const cheerIndex = Math.min(Math.floor((completedTasks / totalTasks) * 10), cheers.length - 1);
                    // Force the "all done" message if perfectly finished
                    if (completedTasks === totalTasks) {
                        cheerMessage.textContent = cheers[cheers.length - 1];
                        cheerMessage.classList.add('text-2xl', 'animate-pulse');
                    } else {
                        cheerMessage.textContent = cheers[cheerIndex];
                        cheerMessage.classList.remove('text-2xl', 'animate-pulse');
                    }
                } else {
                    cheerMessage.textContent = "";
                }
            }

            // Restore saved states from localStorage
            checkboxes.forEach(box => {
                // The box state was already set during generation, but we need the change event listeners
                box.addEventListener('change', function() {
                    const row = this.closest('.task-row');
                    if (this.checked) {
                        row.classList.add('completed');
                        // Pop effect
                        this.style.transform = "scale(1.2)";
                        setTimeout(() => this.style.transform = "scale(1)", 200);
                        localStorage.setItem(this.id, 'true');
                    } else {
                        row.classList.remove('completed');
                        localStorage.setItem(this.id, 'false');
                    }
                    updateProgress();
                });
            });

            // Initialize progress on load
            updateProgress();
        });
    </script>
